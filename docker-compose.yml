services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    env_file:
      - .env
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_TARGET: http://backend:8000
    depends_on:
      - backend
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: skill_barter
      POSTGRES_USER: skill_barter
      POSTGRES_PASSWORD: skill_barter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
